<script>
    // State management
    let materialCounter = 1;
    let currentProject = {
      name: 'New Project Estimate',
      materials: [],
      labor: 0,
      equipment: 0,
      hauling: 0,
      markup: 20,
      projectInfo: {
        description: '',
        date: '',
        clientName: '',
        clientContact: ''
      }
    };

    // Modal functionality
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modal = document.getElementById('projectInfoModal');

    openModalBtn.addEventListener('click', () => {
      modal.classList.add('flex');
    });

    closeModalBtn.addEventListener('click', () => {
      modal.classList.remove('flex');
    });

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        modal.classList.remove('flex');
      }
    });

    // Utility functions
    function parseNumber(value) {
      const num = parseFloat(value) || 0;
      return num;
    }

    function formatCurrency(value) {
      return `$${value.toFixed(2)}`;
    }

    function formatVolume(value) {
      return `${value.toFixed(2)} cu yd`;
    }

    // Volume calculation (convert to cubic yards)
    function calculateVolume(length, width, height, lUnit, wUnit, hUnit) {
      // Convert to feet
      const l = lUnit === 'in' ? length / 12 : length;
      const w = wUnit === 'in' ? width / 12 : width;
      const h = hUnit === 'in' ? height / 12 : height;

      // Calculate cubic feet
      const cubicFeet = l * w * h;

      // Convert to cubic yards (27 cubic feet = 1 cubic yard)
      return cubicFeet / 27;
    }

    // Calculate material cost
    function calculateMaterialCost(card) {
      const lengthInput = card.querySelector('.length-input');
      const widthInput = card.querySelector('.width-input');
      const heightInput = card.querySelector('.height-input');
      const costInput = card.querySelector('.cost-per-unit');

      const length = parseNumber(lengthInput.value);
      const width = parseNumber(widthInput.value);
      const height = parseNumber(heightInput.value);
      const costPerUnit = parseNumber(costInput.value);

      const lUnit = card.querySelector('input[name^="l-unit"]:checked')?.value || 'ft';
      const wUnit = card.querySelector('input[name^="w-unit"]:checked')?.value || 'ft';
      const hUnit = card.querySelector('input[name^="h-unit"]:checked')?.value || 'ft';

      const volume = calculateVolume(length, width, height, lUnit, wUnit, hUnit);
      const cost = volume * costPerUnit;

      // Update volume display
      const volumeDisplay = card.querySelector('.volume-display');
      volumeDisplay.textContent = formatVolume(volume);
      volumeDisplay.classList.toggle('text-primary', volume > 0);
      volumeDisplay.classList.toggle('text-gray-500', volume === 0);
      volumeDisplay.classList.toggle('dark:text-gray-400', volume === 0);

      return { volume, cost };
    }

    // Update all calculations
    function updateCalculations() {
      const cards = document.querySelectorAll('.material-card');
      let totalMaterialCost = 0;
      const subtotals = [];

      // Calculate each material
      cards.forEach(card => {
        const { volume, cost } = calculateMaterialCost(card);
        const description = card.querySelector('.material-description').value || 'Unnamed Material';

        if (cost > 0) {
          totalMaterialCost += cost;
          subtotals.push({ description, cost });
        }
      });

      // Update material subtotals
      const subtotalsContainer = document.getElementById('materialSubtotals');
      subtotalsContainer.innerHTML = subtotals.map(item => `
        <div class="flex justify-between items-center">
          <p class="text-gray-600 dark:text-gray-300">${item.description}</p>
          <p class="text-black dark:text-white font-medium">${formatCurrency(item.cost)}</p>
        </div>
      `).join('') || '<p class="text-gray-500 dark:text-gray-400">No materials added yet</p>';

      // Get labor costs
      const labor = parseNumber(document.getElementById('laborCost').value);
      const equipment = parseNumber(document.getElementById('equipmentCost').value);
      const hauling = parseNumber(document.getElementById('haulingCost').value);

      // Calculate subtotal
      const subtotal = totalMaterialCost + labor + equipment + hauling;
      document.getElementById('subtotalDisplay').textContent = formatCurrency(subtotal);

      // Calculate markup
      const markupPercent = parseNumber(document.getElementById('markupSelect').value);
      const markupAmount = subtotal * (markupPercent / 100);
      document.getElementById('markupAmount').textContent = `(${formatCurrency(markupAmount)})`;

      // Calculate grand total
      const grandTotal = subtotal + markupAmount;
      document.getElementById('grandTotal').textContent = formatCurrency(grandTotal);
    }

    // Create new material card
    function createMaterialCard(index) {
      const card = document.createElement('div');
      card.className = 'space-y-4 rounded-xl bg-gray-100 dark:bg-[#1C2720] p-4 mb-4 material-card';
      card.setAttribute('data-material-id', index);

      card.innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1 space-y-2">
            <p class="text-black dark:text-white text-base font-medium leading-normal">Material #${index + 1}</p>

              <div class="flex h-12 flex-shrink-0 items-center rounded-r-lg bg-gray-200 dark:bg-[#28392f] p-0.5 border border-l-0 border-gray-300 dark:border-[#3b5445]">

                  <span class="truncate">ft</span>

                </label>
                <label class="flex cursor-pointer h-full items-center justify-center rounded-md px-2.5 has-[:checked]:bg-white dark:has-[:checked]:bg-[#111814] text-gray-500 dark:text-[#9db9a8] has-[:checked]:text-black dark:has-[:checked]:text-white text-sm font-medium">

          <div class="flex flex-col gap-2">

              <input class="height-input form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-black dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 dark:border-[#3b5445] bg-white dark:bg-[#1c2720] focus:border-gray-400 dark:focus:border-[#3b5445] h-12 placeholder:text-gray-400 dark:placeholder:text-[#9db9a8] px-3 text-base font-normal" placeholder="0" value=""/>
              <div class="flex h-12 flex-shrink-0 items-center rounded-r-lg bg-gray-200 dark:bg-[#28392f] p-0.5 border border-l-0 border-gray-300 dark:border-[#3b5445]">
                <label class="flex cursor-pointer h-full items-center justify-center rounded-md px-2.5 has-[:checked]:bg-white dark:has-[:checked]:bg-[#111814] text-gray-500 dark:text-[#9db9a8] has-[:checked]:text-black dark:has-[:checked]:text-white text-sm font-medium">

          <div class="flex items-center justify-between">
            <p class="text-black dark:text-white font-bold text-lg">Materials totals</p>
            <p class="volume-display text-lg font-bold text-gray-500 dark:text-gray-400">0.00 cu yd</p>
          </div>
          <div class="flex flex-col sm:flex-row sm:items-center gap-2">
            <label class="flex items-center gap-1 flex-1">
              <span class="text-gray-500 dark:text-gray-400 text-sm">$</span>
              <input class="cost-per-unit form-input flex w-full resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 dark:border-[#3b5445] bg-white dark:bg-[#1c2720] focus:border-gray-400 dark:focus:border-[#3b5445] h-10 placeholder:text-gray-400 dark:placeholder:text-[#9db9a8] px-2 text-sm font-normal" placeholder="Cost per unit (cu yd)" value=""/>
            </label>
            <input class="source-input form-input flex w-full sm:w-auto flex-1 resize-none overflow-hidden rounded-lg text-black dark:text-white focus:outline-0 focus:ring-0 border border-gray-300 dark:border-[#3b5445] bg-white dark:bg-[#1c2720] focus:border-gray-400 dark:focus:border-[#3b5445] h-10 placeholder:text-gray-400 dark:placeholder:text-[#9db9a8] px-2 text-sm font-normal" placeholder="Source (optional)" value=""/>

      `;

      return card;
    }

    // Add material
    document.getElementById('addMaterialBtn').addEventListener('click', () => {
      const container = document.getElementById('materialsContainer');
      const newCard = createMaterialCard(materialCounter);
      container.appendChild(newCard);
      materialCounter++;

      // Add event listeners to new card
      attachCardEventListeners(newCard);
      updateCalculations();
    });

    // Attach event listeners to a card
    function attachCardEventListeners(card) {
      // Delete button
      const deleteBtn = card.querySelector('.delete-material');
      deleteBtn.addEventListener('click', () => {
        card.remove();
        updateCalculations();
        renumberMaterials();
      });

      // Input changes
      const inputs = card.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('input', updateCalculations);
        input.addEventListener('change', updateCalculations);
      });
    }

    // Renumber materials after deletion
    function renumberMaterials() {
      const cards = document.querySelectorAll('.material-card');
      cards.forEach((card, index) => {
        card.setAttribute('data-material-id', index);
        const label = card.querySelector('p.text-base');
        label.textContent = `Material #${index + 1}`;
      });
    }

    // Save project
    function saveProject() {
      const projectName = prompt('Enter project name:', currentProject.name);
      if (!projectName) return;

      // Collect all material data
      const materials = [];
      document.querySelectorAll('.material-card').forEach(card => {
        materials.push({
          description: card.querySelector('.material-description').value,
          length: card.querySelector('.length-input').value,
          width: card.querySelector('.width-input').value,
          height: card.querySelector('.height-input').value,
          lUnit: card.querySelector('input[name^="l-unit"]:checked')?.value || 'ft',
          wUnit: card.querySelector('input[name^="w-unit"]:checked')?.value || 'ft',
          hUnit: card.querySelector('input[name^="h-unit"]:checked')?.value || 'ft',
          cost: card.querySelector('.cost-per-unit').value,
          source: card.querySelector('.source-input').value
        });
      });

      currentProject = {
        name: projectName,
        materials,
        labor: document.getElementById('laborCost').value,
        equipment: document.getElementById('equipmentCost').value,
        hauling: document.getElementById('haulingCost').value,
        markup: document.getElementById('markupSelect').value,
        projectInfo: {
          description: document.getElementById('projectDescription').value,
          date: document.getElementById('projectDate').value,
          clientName: document.getElementById('clientName').value,
          clientContact: document.getElementById('clientContact').value
        }
      };

      // Save to localStorage
      const projects = JSON.parse(localStorage.getItem('concreteProjects') || '{}');
      projects[projectName] = currentProject;
      localStorage.setItem('concreteProjects', JSON.stringify(projects));

      // Update dropdown
      updateProjectDropdown();

      alert('Project saved successfully!');
    }

    // Load project
    function loadProject(projectName) {
      const projects = JSON.parse(localStorage.getItem('concreteProjects') || '{}');
      const project = projects[projectName];

      if (!project) return;

      currentProject = project;

      // Clear existing materials
      document.getElementById('materialsContainer').innerHTML = '';
      materialCounter = 0;

      // Load materials
      project.materials.forEach((mat, index) => {
        const card = createMaterialCard(index);
        card.querySelector('.material-description').value = mat.description || '';
        card.querySelector('.length-input').value = mat.length || '';
        card.querySelector('.width-input').value = mat.width || '';
        card.querySelector('.height-input').value = mat.height || '';
        card.querySelector('.cost-per-unit').value = mat.cost || '';
        card.querySelector('.source-input').value = mat.source || '';

        // Set units
        const lRadio = card.querySelector(`input[name="l-unit-${index}"][value="${mat.lUnit}"]`);
        const wRadio = card.querySelector(`input[name="w-unit-${index}"][value="${mat.wUnit}"]`);
        const hRadio = card.querySelector(`input[name="h-unit-${index}"][value="${mat.hUnit}"]`);
        if (lRadio) lRadio.checked = true;
        if (wRadio) wRadio.checked = true;
        if (hRadio) hRadio.checked = true;

        document.getElementById('materialsContainer').appendChild(card);
        attachCardEventListeners(card);
        materialCounter++;
      });

      // Load labor costs
      document.getElementById('laborCost').value = project.labor || '';
      document.getElementById('equipmentCost').value = project.equipment || '';
      document.getElementById('haulingCost').value = project.hauling || '';
      document.getElementById('markupSelect').value = project.markup || 20;

      // Load project info
      document.getElementById('projectDescription').value = project.projectInfo.description || '';
      document.getElementById('projectDate').value = project.projectInfo.date || '';
      document.getElementById('clientName').value = project.projectInfo.clientName || '';
      document.getElementById('clientContact').value = project.projectInfo.clientContact || '';

      updateCalculations();
    }

    // Update project dropdown
    function updateProjectDropdown() {
      const projects = JSON.parse(localStorage.getItem('concreteProjects') || '{}');
      const selector = document.getElementById('projectSelector');

      selector.innerHTML = '<option value="new">New Project Estimate</option>';

      Object.keys(projects).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        selector.appendChild(option);
      });
    }

    // Project dropdown change
    document.getElementById('projectSelector').addEventListener('change', (e) => {
      if (e.target.value === 'new') {
        location.reload();
      } else {
        loadProject(e.target.value);
      }
    });

    // Save button
    document.getElementById('saveBtn').addEventListener('click', saveProject);

    // Save project info button
    document.getElementById('saveInfoBtn').addEventListener('click', () => {
      modal.classList.remove('flex');
      alert('Project information saved!');
    });

    // Generate button - print/download
    document.getElementById('generateBtn').addEventListener('click', () => {
      window.print();
    });

    // Share button
    document.getElementById('shareBtn').addEventListener('click', () => {
      const text = `Concrete Project Estimate\nGrand Total: ${document.getElementById('grandTotal').textContent}`;

      if (navigator.share) {
        navigator.share({
          title: 'Concrete Project Estimate',
          text: text
        });
      } else {
        // Fallback - copy to clipboard
        navigator.clipboard.writeText(text).then(() => {
          alert('Estimate copied to clipboard!');
        });
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Attach listeners to initial material card
      const initialCard = document.querySelector('.material-card');
      if (initialCard) {
        attachCardEventListeners(initialCard);
      }

      // Add listeners to labor inputs
      ['laborCost', 'equipmentCost', 'haulingCost', 'markupSelect'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateCalculations);
        document.getElementById(id).addEventListener('change', updateCalculations);
      });

      // Load saved projects into dropdown
      updateProjectDropdown();

      // Initial calculation
      updateCalculations();
    });
  </script>

</body></html>
